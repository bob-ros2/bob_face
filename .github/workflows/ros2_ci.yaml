name: ROS 2 CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: ros:humble-ros-base
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          path: bob_face

      - name: Checkout bob_msgs
        uses: actions/checkout@v3
        with:
          repository: bob-ros2/bob_msgs
          path: bob_msgs

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions
          rosdep update
          rosdep install --from-paths . --ignore-src -r -y

      - name: Build
        run: |
          . /opt/ros/humble/setup.sh
          colcon build --packages-up-to bob_face \
            --build-base ../build \
            --install-base ../install

      - name: Test
        run: |
          . /opt/ros/humble/setup.sh
          colcon test --packages-up-to bob_face \
            --build-base ../build \
            --install-base ../install
          colcon test-result --test-result-base ../build --all --verbose
